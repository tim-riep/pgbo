name: Publish

# Manually triggered. Runs the full test suite, then publishes any
# packages whose current version is not yet on npm.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run — validate everything but do not publish'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to create git tags + GitHub releases
      id-token: write   # for npm provenance via OIDC

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGBO_TEST_URL: postgresql://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Node 24 ships with npm 11.5+ — required for Trusted Publishing (OIDC).
      # Node 22's bundled npm 10.9 is too old, and upgrading npm in-place in CI
      # hits a known self-breakage bug (MODULE_NOT_FOUND: promise-retry).
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Publish (dry run)
        if: inputs.dry-run == true
        run: |
          npm publish --workspace @pgbo/core --provenance --access public --dry-run
          npm publish --workspace @pgbo/fastify --provenance --access public --dry-run

      # No NPM_TOKEN — authenticates via OIDC against npm's Trusted Publisher
      # config for @pgbo/core and @pgbo/fastify. Requires id-token:write (above).
      - name: Publish to npm + create GitHub release
        if: inputs.dry-run != true
        uses: changesets/action@v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
