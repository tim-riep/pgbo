name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGBO_TEST_URL: postgresql://postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Build packages in dependency order so each package's `dist/` is
      # available when the next package's tsc resolves its types:
      #   @metadataui/spec → @pgbo/core → @metadataui/client → @pgbo/fastify
      # (deprecation shim @pgbo/client only needs @metadataui/client built.)
      - name: Build @metadataui/spec (foundation for everything)
        run: npm run build -w @metadataui/spec

      - name: Build @pgbo/core (needs spec; adapter typecheck needs it)
        run: npm run build -w @pgbo/core

      - name: Build @metadataui/client (needs spec)
        run: npm run build -w @metadataui/client

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
